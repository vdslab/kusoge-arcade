<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>ラーメン湯切りパニック | Kusoge Arcade</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="back-link" href="../../">← 格納庫へ戻る</a>
      <button id="mute-btn" class="ghost-btn" type="button" aria-pressed="false">🔊 音あり</button>
    </header>

    <main class="stage">
      <h1>ラーメン湯切りパニック</h1>
      <p class="lead">湯切りタイマーが目標秒数でストップ！0.1 秒でもズレると店が爆発！</p>

      <div class="hud" role="status" aria-live="polite">
        <div class="hud-box"><span>TARGET</span><strong id="target-time">6.00</strong></div>
        <div class="hud-box"><span>NOW</span><strong id="current-time">0.00</strong></div>
        <div class="hud-box"><span>BEST</span><strong id="best-score">0</strong></div>
      </div>

      <canvas id="game-canvas" width="480" height="320" aria-label="ラーメン湯切りパニックのプレイ画面"></canvas>

      <p id="result-banner" class="result-banner" aria-live="polite">スタートを押して開始！</p>

      <div class="controls">
        <button id="start-btn" class="primary-btn" type="button">スタート</button>
        <button id="stop-btn" class="accent-btn" type="button" hidden>ストップ！！</button>
        <button id="retry-btn" class="primary-btn" type="button" hidden>もう一回</button>
      </div>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
