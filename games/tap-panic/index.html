<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>10秒連打パニック | Kusoge Arcade</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="back-link" href="../../">← 格納庫へ戻る</a>
      <button id="mute-btn" class="ghost-btn" type="button" aria-pressed="false">🔊 音あり</button>
    </header>

    <main class="stage">
      <h1>10秒連打パニック</h1>
      <p class="lead">暴れるターゲットを10秒間たたきまくれ（Spaceキーでも連打可）</p>

      <div class="hud" role="status" aria-live="polite">
        <div class="hud-box"><span>SCORE</span><strong id="score">0</strong></div>
        <div class="hud-box"><span>TIME</span><strong id="time-left">10.0</strong></div>
        <div class="hud-box"><span>BEST</span><strong id="best-score">0</strong></div>
      </div>

      <canvas id="game-canvas" width="480" height="320" aria-label="10秒連打パニックのプレイ画面"></canvas>

      <p id="result-banner" class="result-banner" aria-live="polite">スタートを押して開始！</p>

      <div class="controls">
        <button id="start-btn" class="primary-btn" type="button">スタート</button>
        <button id="tap-btn" class="accent-btn" type="button" hidden>連打！！</button>
        <button id="retry-btn" class="primary-btn" type="button" hidden>もう一回</button>
      </div>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
